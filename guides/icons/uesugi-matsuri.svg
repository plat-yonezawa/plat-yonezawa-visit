<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 米沢上杉まつり：上杉謙信の「毘」の旗と、春の桜 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E2B35"/><stop offset="1" stop-color="#3B1520"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#EDE4D3"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F6C46B" stop-opacity=".55"/><stop offset="1" stop-color="#F6C46B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="78" cy="40" r="46" fill="url(#sun)"/>
  <!-- 旗竿と旗 -->
  <rect x="41" y="12" width="3" height="100" rx="1.5" fill="#2A1A12"/>
  <rect x="38" y="13" width="40" height="3" rx="1.5" fill="#2A1A12"/>
  <path d="M44 16h33v62c-6 3-11 3-16 0s-11-3-17 0z" fill="url(#cloth)"/>
  <path d="M44 16h33v62c-6 3-11 3-16 0s-11-3-17 0z" fill="none" stroke="#C9B992" stroke-width=".8"/>
  <text x="60.5" y="58" text-anchor="middle" font-family="Hiragino Mincho ProN,Yu Mincho,YuMincho,Noto Serif JP,serif"
        font-size="30" font-weight="700" fill="#1C1A1A">毘</text>
  <!-- 桜の花びら -->
  <g fill="#F6B9C4">
    <path d="M92 74c3-5 9-4 9 1s-6 7-9 3c-1 3-6 3-6-1s3-6 6-3z"/>
    <path d="M20 88c2-4 7-3 7 1s-5 5-7 2c-1 2-5 2-5-1s3-4 5-2z" opacity=".9"/>
    <path d="M98 100c2-3 6-2 6 1s-4 4-6 2c-1 2-4 1-4-1s2-3 4-2z" opacity=".8"/>
    <circle cx="86" cy="94" r="2" opacity=".7"/><circle cx="26" cy="104" r="1.6" opacity=".7"/>
  </g>
</svg>
