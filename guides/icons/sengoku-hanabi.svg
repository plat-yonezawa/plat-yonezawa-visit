  <path d="M0 120V100h12v-6h6v6h10l6-8h20l6 8h8v-12l8-6 8 6v12h12v-5h8v5h16v20z" fill="#0B0F22"/>
  <path d="M60 92h20l-10-7z" fill="#0B0F22"/>
</svg>
