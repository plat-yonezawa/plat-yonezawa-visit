  <g stroke="#9FD3FF" stroke-width="1.3" stroke-linecap="round"><path d="M97 82v-9M97 82v9M97 82h-9M97 82h9M97 82l-6-6M97 82l6 6M97 82l-6 6M97 82l6-6"/></g>
