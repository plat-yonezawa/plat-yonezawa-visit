<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 新田織物：紅花（黄から紅へ）と、紅花で染めた絹糸 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E6"/><stop offset="1" stop-color="#F1E2C8"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8243F"/><stop offset="1" stop-color="#E8667A"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A23B"/><stop offset="1" stop-color="#F5D06E"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9E1B32"/><stop offset="1" stop-color="#C8475C"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <!-- 紅花：外側は紅、内側は黄 -->
  <g transform="translate(60 40)">
    <g fill="#D8343F">
      <path d="M0-26c3 6 3 14 0 20-3-6-3-14 0-20z"/><path d="M0-26c3 6 3 14 0 20-3-6-3-14 0-20z" transform="rotate(30)"/>
      <path d="M0-26c3 6 3 14 0 20-3-6-3-14 0-20z" transform="rotate(-30)"/><path d="M0-26c3 6 3 14 0 20-3-6-3-14 0-20z" transform="rotate(60)"/>
      <path d="M0-26c3 6 3 14 0 20-3-6-3-14 0-20z" transform="rotate(-60)"/>
    </g>
    <g fill="#F2A93B">
      <path d="M0-20c2.5 5 2.5 10 0 15-2.5-5-2.5-10 0-15z" transform="rotate(15)"/><path d="M0-20c2.5 5 2.5 10 0 15-2.5-5-2.5-10 0-15z" transform="rotate(-15)"/>
      <path d="M0-20c2.5 5 2.5 10 0 15-2.5-5-2.5-10 0-15z" transform="rotate(45)"/><path d="M0-20c2.5 5 2.5 10 0 15-2.5-5-2.5-10 0-15z" transform="rotate(-45)"/>
    </g>
    <!-- がく（緑） -->
    <path d="M-12-2c4 8 20 8 24 0-2 10-8 14-12 14s-10-4-12-14z" fill="#6D9678"/>
    <path d="M-10 0l4 5M10 0l-4 5M0 2v7" stroke="#4F7559" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- 絹糸（織り）：3本の波 -->
  <path d="M-4 78c20-10 40 10 64 0s44-10 64 0" fill="none" stroke="url(#t1)" stroke-width="7" stroke-linecap="round"/>
  <path d="M-4 92c20-10 40 10 64 0s44-10 64 0" fill="none" stroke="url(#t2)" stroke-width="7" stroke-linecap="round"/>
  <path d="M-4 106c20-10 40 10 64 0s44-10 64 0" fill="none" stroke="url(#t3)" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1.2" fill="none">
    <path d="M-4 76c20-10 40 10 64 0s44-10 64 0"/><path d="M-4 90c20-10 40 10 64 0s44-10 64 0"/><path d="M-4 104c20-10 40 10 64 0s44-10 64 0"/>
  </g>
</svg>
