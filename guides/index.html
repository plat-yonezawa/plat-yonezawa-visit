<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F2633">
<title>YONEZAWA GUIDES</title>
<!--
  ガイドアプリ（YONEZAWA GUIDES）のトップ。
  ・一覧の中身は /guides/catalog.json（本番は Worker が pm の管理画面で保存した内容を返す）。
    HTMLにガイド名を直書きしない。ガイドが増えたら管理画面で1件足すだけ
  ・言語は ?lang= → 前回選んだ言語（localStorage・各ガイドと共有）→ 日本語
  ・?preview=1 は管理画面のプレビュー用。親（pm）から postMessage で届いた下書きを描く
-->
<style>
:root{
  --navy:#3D4A64; --ink:#1F2633; --terra:#A06E4F; --sage:#6D9678; --rose:#B85565;
  --paper:#F6F3EE; --line:#E2DCD2; --muted:#6B6F78;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif TC",serif;
  --sans:"Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Noto Sans TC",system-ui,sans-serif;
  --dock-h:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── ヘッダー（写真の上に重ねる） ── */
.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px 16px;color:#fff;transition:background .2s}
.top.solid{background:rgba(31,38,51,.92)}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.14em;line-height:1.15;text-decoration:none;margin-right:auto}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.12em;opacity:.8;white-space:nowrap}
@media (max-width:400px){.brand small{display:none}}
.langs{display:flex;align-items:center}
.langs svg{margin-right:2px;opacity:.9}
.langs button{min-width:40px;min-height:44px;padding:0 6px;font-size:13px;letter-spacing:.04em;opacity:.75;position:relative}
.langs button[aria-pressed="true"]{opacity:1;font-weight:700}
.langs button[aria-pressed="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:8px;height:2px;background:#fff}
.menu-btn{min-width:52px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;letter-spacing:.16em}
.dots{display:grid;grid-template-columns:repeat(3,6px);gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:#D79A77}
.dots i:nth-child(even){background:#9DB0CF}

/* ── トップの写真 ── */
.hero{position:relative;height:100svh;min-height:520px;background:#2a3346 center/cover no-repeat;color:#fff;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,26,38,.45) 0%,rgba(20,26,38,.1) 35%,rgba(20,26,38,.65) 100%)}
.hero-in{position:absolute;left:0;right:0;bottom:calc(var(--dock-h) + 40px);z-index:1;padding:0 24px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8.6vw,56px);line-height:1.35;letter-spacing:.04em;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.hero p{margin-top:12px;font-size:13px;letter-spacing:.14em;opacity:.9}
.credit{position:absolute;right:12px;bottom:calc(var(--dock-h) + 10px);z-index:1;font-size:10px;opacity:.7}

/* ── ガイド一覧（カード） ── */
.sec{max-width:880px;margin:0 auto;padding:56px 20px 8px}
.sec-h{text-align:center;margin-bottom:24px}
.sec-h .en{font-family:var(--serif);font-size:24px;letter-spacing:.08em;color:var(--navy)}
.sec-h .ja{display:block;font-size:12px;letter-spacing:.3em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{display:flex;flex-direction:column;background:#fff;border-radius:16px;overflow:hidden;text-decoration:none;
  border:1px solid var(--line)}
.card-img{aspect-ratio:16/10;background:#ddd center/cover no-repeat;position:relative}
.card-ico{position:absolute;left:14px;bottom:-22px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.card-body{padding:30px 18px 18px}
.card h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.4}
.card p{margin-top:6px;font-size:14px;color:#4a4f59}
.card .go{margin-top:12px;font-size:13px;color:var(--navy);font-weight:700}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#F3E3B8;color:#6b4e00;margin-left:6px;vertical-align:2px}
.prose{max-width:640px;margin:0 auto;font-size:15px;white-space:pre-line}
.foot{padding:40px 20px 24px;text-align:center;font-size:12px;color:var(--muted)}

/* ── 下部のドック（4つ固定） ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(31,38,51,.86);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);color:#fff}
.dock a,.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;justify-content:center;
  text-decoration:none;font-size:10.5px;line-height:1.25;text-align:center;padding:2px}
.dock .di{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12)}

/* ── MENU＝ホーム画面（アプリアイコンを並べる） ── */
.home{position:fixed;inset:0;z-index:50;display:none;color:#fff;background:#141a26}
.home.on{display:block}
.home-bg{position:absolute;inset:-30px;background:center/cover no-repeat;filter:blur(18px) brightness(.45);transform:scale(1.05)}
.home-in{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 0 0}
.home-top{display:flex;justify-content:space-between;align-items:center;padding:0 12px 0 20px}
.home-top .brand{font-size:14px}
.close{min-width:52px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;letter-spacing:.16em}
.pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;display:grid;align-content:start;justify-items:center;
  padding:28px 20px 12px;row-gap:22px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;width:100%;max-width:150px}
.app-ico{width:var(--ico);height:var(--ico);border-radius:calc(var(--ico) * .23);display:flex;align-items:center;justify-content:center;
  color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.28)}
.app-ico svg{width:46%;height:46%}
.art{background:#ddd center/cover no-repeat}
.app .lbl{font-size:var(--lbl);line-height:1.3;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.app:active .app-ico{transform:scale(.94)}
.pdots{display:flex;justify-content:center;gap:7px;min-height:20px;padding-bottom:6px}
.pdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.pdots i.on{background:#fff}
.home .dock{position:relative;background:rgba(255,255,255,.14);margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:26px;padding:8px}

/* ── シート（このサイトについて・使い方・準備中） ── */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(10,14,22,.5)}
.sheet.on{display:flex}
.sheet-in{width:100%;max-height:80vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 22px calc(28px + env(safe-area-inset-bottom))}
.sheet-in h2{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:10px;color:var(--navy)}
.sheet-in .x{float:right;min-width:44px;min-height:44px;font-size:22px;line-height:1;color:var(--muted)}
@media (min-width:720px){.sheet{align-items:center;justify-content:center}.sheet-in{max-width:560px;border-radius:20px}}
.state{padding:120px 24px;text-align:center;color:var(--muted)}
</style>
<script src="/guides/icons.js"></script>
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="/guides/" id="brand">YONEZAWA GUIDES<small id="brandSub"></small></a>
  <div class="langs" role="group" aria-label="Language">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>
    <button type="button" data-lang="ja" aria-pressed="false">JA</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="tw" aria-pressed="false">繁中</button>
  </div>
  <button type="button" class="menu-btn" id="menuBtn" aria-haspopup="dialog" aria-controls="home">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>MENU
  </button>
</header>

<main id="main"><div class="state">Loading…</div></main>
<nav class="dock" id="dock" aria-label="Site"></nav>

<div class="home" id="home" role="dialog" aria-modal="true" aria-label="MENU">
  <div class="home-bg" id="homeBg"></div>
  <div class="home-in">
    <div class="home-top">
      <span class="brand">YONEZAWA GUIDES</span>
      <button type="button" class="close" id="homeClose">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>CLOSE
      </button>
    </div>
    <div class="pages" id="pages"></div>
    <div class="pdots" id="pdots" aria-hidden="true"></div>
    <nav class="dock" id="homeDock" aria-label="Site"></nav>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH">
  <div class="sheet-in"><button type="button" class="x" id="sheetX" aria-label="Close">×</button>
    <h2 id="sheetH"></h2><div class="prose" id="sheetB"></div></div>
</div>

<script>
(function(){
  'use strict';
  var KEY='yonezawa-guides-lang', LANGS=['ja','en','tw'];
  var UI={
    guides:{ja:'ガイド',en:'Guides',tw:'導覽'},
    open:{ja:'ガイドを開く →',en:'Open the guide →',tw:'開啟導覽 →'},
    draft:{ja:'下書き',en:'Draft',tw:'草稿'},
    about:{ja:'このサイトについて',en:'About',tw:'關於本站'},
    contact:{ja:'お問い合わせ',en:'Contact',tw:'聯絡我們'},
    howto:{ja:'使い方',en:'How to use',tw:'使用方式'},
    booking:{ja:'ツアー予約',en:'Book a tour',tw:'預約行程'},
    soon:{ja:'準備中です。もうしばらくお待ちください。',en:'Coming soon.',tw:'準備中，敬請期待。'},
    none:{ja:'公開中のガイドはまだありません。',en:'No guides are published yet.',tw:'目前尚無公開的導覽。'},
    fail:{ja:'ガイドの一覧を読み込めませんでした。時間をおいて開き直してください。',en:'Could not load the guides. Please try again later.',tw:'無法載入導覽列表，請稍後再試。'},
    sub:{ja:'米沢・置賜 多言語ガイド',en:'Multilingual guides',tw:'米澤・置賜 多語言導覽'}
  };
  var DOCK=[
    {id:'about',  icon:'info', kind:'sheet'},
    {id:'contact',icon:'mail', kind:'link'},
    {id:'howto',  icon:'help', kind:'sheet'},
    {id:'booking',icon:'ticket',kind:'link'}
  ];
  var Q; try{Q=new URLSearchParams(location.search);}catch(e){Q={get:function(){return null;}};}
  var PREVIEW=Q.get('preview')==='1';
  var lang=(function(){var q=Q.get('lang'),s=null;try{s=localStorage.getItem(KEY);}catch(e){}
    return LANGS.indexOf(q)>=0?q:(LANGS.indexOf(s)>=0?s:'ja');})();
  var cat=null;
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var tx=function(o){return o?(o[lang]||o.ja||o.en||''):'';};
  var t=function(k){return tx(UI[k]);};
  var ico=function(n,s){return window.YG_ICON_SVG?window.YG_ICON_SVG(n,s):'';};
  // リンクに表示中の言語を付ける（各ガイドが ?lang= を読んで同じ言語で開く）
  var withLang=function(u){if(!u)return '';try{var x=new URL(u,location.href);if(x.origin===location.origin){x.searchParams.set('lang',lang);return x.pathname+x.search+x.hash;}return x.href;}catch(e){return u;}};
  // アプリアイコン：絵柄の画像（appIcon）があればそれを、無ければ色＋線のアイコン
  var appIco=function(g,cls,s){return g.appIcon?'<span class="'+cls+' art" style="background-image:url(&quot;'+esc(g.appIcon)+'&quot;)"></span>'
    :'<span class="'+cls+'" style="background:'+esc(g.color||'#ccc')+'">'+ico(g.icon,s)+'</span>';};
  var visible=function(){return (cat&&cat.guides||[]).filter(function(g){return g.status==='public'||(PREVIEW&&g.status==='draft');});};

  function setLang(l,save){
    lang=l; document.documentElement.lang=l==='tw'?'zh-Hant':l;
    document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l?'true':'false');});
    if(save){try{localStorage.setItem(KEY,l);}catch(e){}
      try{var u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(e){}}
    render();
  }

  function render(){
    $('brandSub').textContent=t('sub');
    if(!cat){return;}
    var s=cat.site||{}, gs=visible();
    var hero=(s.hero&&s.hero.image)||'';
    $('homeBg').style.backgroundImage=hero?'url("'+hero+'")':'';
    var cards=gs.map(function(g){
      return '<a class="card" href="'+esc(withLang(g.url))+'">'+
        '<div class="card-img" style="background-image:url(&quot;'+esc(g.image||'')+'&quot;)">'+
        appIco(g,'card-ico',28)+'</div>'+
        '<div class="card-body"><h3>'+esc(tx(g.title))+(g.status==='draft'?'<span class="badge">'+esc(t('draft'))+'</span>':'')+'</h3>'+
        '<p>'+esc(tx(g.summary))+'</p><div class="go">'+esc(t('open'))+'</div></div></a>';
    }).join('');
    $('main').innerHTML=
      '<section class="hero" style="background-image:url(&quot;'+esc(hero)+'&quot;)">'+
        '<div class="hero-in"><h1>'+esc(tx(s.tagline))+'</h1><p>'+esc(s.name||'YONEZAWA GUIDES')+'</p></div>'+
        (s.hero&&s.hero.credit?'<div class="credit">'+esc(s.hero.credit)+'</div>':'')+'</section>'+
      '<section class="sec" id="list"><div class="sec-h"><span class="en">GUIDES</span><span class="ja">'+esc(t('guides'))+'</span></div>'+
        (cards?'<div class="cards">'+cards+'</div>':'<p class="prose" style="text-align:center">'+esc(t('none'))+'</p>')+'</section>'+
      '<section class="sec" id="about"><div class="sec-h"><span class="en">ABOUT</span><span class="ja">'+esc(t('about'))+'</span></div>'+
        '<p class="prose">'+esc(tx(s.about))+'</p></section>'+
      '<div class="foot">© PLAT YONEZAWA, Inc.</div>';
    renderHome(gs); renderDock();
  }

  // ホーム画面：最大 4列×3行＝12個で1ページ。少ないうちはアイコンを大きく（2列→3列→4列）
  function renderHome(gs){
    var n=gs.length, cols=n<=4?2:(n<=9?3:4), per=12, pages=[];
    for(var i=0;i<Math.max(n,1);i+=per) pages.push(gs.slice(i,i+per));
    var w=Math.min(window.innerWidth,520), icoPx=Math.round(Math.min(cols===2?112:(cols===3?84:64),(w-40)/cols-28));
    $('pages').innerHTML=pages.map(function(p){
      return '<div class="page" style="grid-template-columns:repeat('+cols+',1fr);--ico:'+icoPx+'px;--lbl:'+(cols===4?11:12.5)+'px">'+
        p.map(function(g){return '<a class="app" href="'+esc(withLang(g.url))+'">'+appIco(g,'app-ico')+
          '<span class="lbl">'+esc(tx(g.title))+'</span></a>';}).join('')+'</div>';
    }).join('');
    $('pdots').innerHTML=pages.length>1?pages.map(function(_,i){return '<i class="'+(i?'':'on')+'"></i>';}).join(''):'';
  }

  function renderDock(){
    var links=(cat&&cat.site&&cat.site.links)||{};
    var html=DOCK.map(function(d){
      var inner='<span class="di">'+ico(d.icon,24)+'</span>'+esc(t(d.id));
      if(d.kind==='link'&&links[d.id]) return '<a href="'+esc(withLang(links[d.id]))+'"'+(/^https?:/.test(links[d.id])?' target="_blank" rel="noopener"':'')+'>'+inner+'</a>';
      return '<button type="button" data-sheet="'+d.id+'">'+inner+'</button>';
    }).join('');
    $('dock').innerHTML=html; $('homeDock').innerHTML=html;
  }

  function openSheet(id){
    var s=(cat&&cat.site)||{};
    $('sheetH').textContent=t(id);
    $('sheetB').textContent=id==='about'?tx(s.about):(id==='howto'?tx(s.howto):t('soon'));
    $('sheet').classList.add('on'); $('sheetX').focus();
  }
  function closeSheet(){$('sheet').classList.remove('on');}
  function openHome(){$('home').classList.add('on');document.body.style.overflow='hidden';$('homeClose').focus();}
  function closeHome(){$('home').classList.remove('on');document.body.style.overflow='';$('menuBtn').focus();}

  document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang,true);});});
  $('menuBtn').addEventListener('click',openHome);
  $('homeClose').addEventListener('click',closeHome);
  document.addEventListener('click',function(e){var b=e.target.closest('[data-sheet]');if(b){e.preventDefault();openSheet(b.dataset.sheet);}});
  $('sheetX').addEventListener('click',closeSheet);
  $('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))closeSheet();});
  document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if($('sheet').classList.contains('on'))closeSheet();else if($('home').classList.contains('on'))closeHome();});
  $('pages').addEventListener('scroll',function(){var p=$('pages'),i=Math.round(p.scrollLeft/p.clientWidth);
    [].forEach.call($('pdots').children,function(d,k){d.classList.toggle('on',k===i);});});
  window.addEventListener('scroll',function(){$('top').classList.toggle('solid',window.scrollY>window.innerHeight*0.6);},{passive:true});
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(cat)renderHome(visible());},150);});

  setLang(lang,false);
  if(PREVIEW){
    // 管理画面（pm）からの下書き。送り手のオリジンを確かめてから描く
    var OK=/^(https:\/\/pm\.plat-yonezawa\.com|http:\/\/localhost(:\d+)?|http:\/\/127\.0\.0\.1(:\d+)?)$/;
    window.addEventListener('message',function(e){
      if(!OK.test(e.origin)||!e.data||e.data.type!=='yg-preview')return;
      cat=e.data.catalog; if(e.data.lang&&LANGS.indexOf(e.data.lang)>=0)lang=e.data.lang;
      setLang(lang,false); if(e.data.menu)openHome(); else if($('home').classList.contains('on')&&e.data.menu===false)closeHome();
    });
    if(window.parent!==window) window.parent.postMessage({type:'yg-ready'},'*');
  }
  fetch('/guides/catalog.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){if(PREVIEW&&cat)return;cat=j;render();})
    .catch(function(){if(!cat)$('main').innerHTML='<div class="state">'+esc(t('fail'))+'</div>';});
})();
</script>
</body>
</html>
